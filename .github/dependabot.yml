# Weekly dependency updates, grouped to keep the pull requests few. Every update goes through CI
# (tests, pnpm audit, cargo deny) before it can be merged; a new release waits a week first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # Base images of the relay's container (apps/relay/Dockerfile).
  - package-ecosystem: docker
    directory: /apps/relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
