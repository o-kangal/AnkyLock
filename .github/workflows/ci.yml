# Every push and pull request: the checks of AGENTS.md, browser tests and security scans.
# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Builds and tests never talk to Google or a relay.
  VITE_GOOGLE_CLIENT_ID: ''
  VITE_RELAY_URL: ''

jobs:
  web:
    name: TypeScript (typecheck, lint, test, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r run lint
      - run: pnpm -r run test
      # Builds everything and fails if a Node module reached a browser bundle (scripts/check-build.ts).
      - run: pnpm build:check
        env:
          # The landing site reads the latest release at build time; the token avoids the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm audit

  rust:
    name: Rust (clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The packages Tauri builds against (.github/tauri-packages.txt) come from GitHub's cache: an
      # Ubuntu mirror has stalled this step past ten minutes several times. A new runner image or
      # package list starts from the newest earlier cache, so only packages whose version changed
      # are downloaded again; apt still checks each one against the signed index.
      - name: Runner image
        id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore Tauri system packages
        id: apt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/apt/archives
            ~/apt/lists
          key: tauri-apt-${{ steps.image.outputs.id }}-${{ hashFiles('.github/tauri-packages.txt') }}
          restore-keys: tauri-apt-
      - name: Install Tauri system libraries
        # A stuck mirror fails here instead of eating the job's timeout.
        timeout-minutes: 10
        env:
          CACHED: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          mkdir -p ~/apt/archives/partial ~/apt/lists/partial
          apt=(sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt/archives" -o Dir::State::Lists="$HOME/apt/lists")
          if [ "$CACHED" != true ]; then "${apt[@]}" update; fi
          xargs -a .github/tauri-packages.txt "${apt[@]}" install -y --no-install-recommends
          # apt ran as root; the cache is saved as the runner user.
          sudo chown -R "$USER" ~/apt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop crate embeds the built frontend (tauri.conf.json `frontendDist`).
      - run: pnpm --filter @ankylock/desktop... run build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  browser:
    name: Browser tests (Chromium, WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright's image ships the browsers and their system libraries, so this job needs no apt
    # mirror (one has stalled runs for half an hour). Its tag must match @playwright/test: with a
    # newer one, Playwright stops with "Executable doesn't exist" and the image version to use.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ankylock/web... run build
      - run: pnpm --filter @ankylock/e2e run test:browser
        env:
          # The landing site build reads the latest release (rate limit).
          GITHUB_TOKEN: ${{ github.token }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: tests/test-results/
          retention-days: 7

  security:
    name: Security scans (secrets, crypto patterns, Rust dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history, not only the last commit.
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          docker.io/zricethezav/gitleaks:v8.28.0@sha256:bf00b5e039f0fad4b32935dc5ec1e358f227ccd097bcb64b971f0331072fe2ae
          git --config .gitleaks.toml --redact --verbose --exit-code 1 .
      - name: Crypto pattern scan
        run: bash .claude/skills/crypto-audit/scripts/scan.sh --strict
      - name: cargo deny (advisories, licenses, sources, bans)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  deploy:
    name: Deploy
    needs: [web, rust, browser, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
