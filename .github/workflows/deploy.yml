# Publishes the landing site (ankylock.com) and the web app (app.ankylock.com) to Cloudflare
# Pages: from CI once all its checks pass on main, when a release is published (the download
# page lists it), or by hand. Only main's newest commit is ever deployed, and only after CI has
# passed for it, so an older commit cannot roll the sites back. Secrets: docs/github-settings.md.
name: Deploy

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      # Reading CI's results for the commit about to be deployed.
      actions: read
    steps:
      - name: Pick main's newest commit, if its CI passed
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Called from CI, after all its jobs passed for this push.
            if [ "$GITHUB_SHA" != "$sha" ]; then
              echo "main moved on to $sha; its own CI run deploys it."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq .total_count)
            if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed for $sha yet."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - if: steps.target.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - if: steps.target.outputs.deploy == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.target.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: a deploy installs from the lockfile alone.
          package-manager-cache: false
      - if: steps.target.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build for production
        if: steps.target.outputs.deploy == 'true'
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          VITE_RELAY_URL: ''
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Without a client id the app would silently run local-only.
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then echo "::error::Set the GOOGLE_WEB_CLIENT_ID repository variable."; exit 1; fi
          pnpm build:check

      - name: Nothing but the built files goes out
        if: steps.target.outputs.deploy == 'true'
        run: |
          found=$(find apps/site/dist apps/web/dist \( -name '*.map' -o -name '.*' \) -print)
          if [ -n "$found" ]; then echo "::error::Source maps or dotfiles in the output:"; echo "$found"; exit 1; fi
          test -f apps/site/dist/_headers && test -f apps/web/dist/_headers

      - name: Deploy
        if: steps.target.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # The first deploy creates the two Direct Upload projects.
          projects=$(pnpm exec wrangler pages project list)
          for project in ankylock-site ankylock-app; do
            grep -qw "$project" <<< "$projects" || pnpm exec wrangler pages project create "$project" --production-branch=main
          done
          pnpm exec wrangler pages deploy apps/site/dist --project-name=ankylock-site --branch=main --commit-hash="$SHA" --commit-dirty=false
          pnpm exec wrangler pages deploy apps/web/dist --project-name=ankylock-app --branch=main --commit-hash="$SHA" --commit-dirty=false
