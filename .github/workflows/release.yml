# Builds the Linux packages and prepares a GitHub Release. A version tag (`v0.1.0`) builds them
# and creates a draft release, which the maintainer reviews and publishes on GitHub; publishing
# deploys the site (its download page lists the release) and reaches AppImage users as an
# update. Run by hand, it is a dry run: the same build, kept as a workflow artifact, published
# nowhere. Steps: README "Releases".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the Linux packages
    # The oldest supported Ubuntu: packages built against its libraries run on newer systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            released=--released
          else
            version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
            released=
          fi
          # A tag needs matching versions everywhere and dated notes in CHANGELOG.md.
          node scripts/release-files.ts check "$version" $released
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Tauri system libraries
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          xargs -a .github/tauri-packages.txt sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A release installs from the lockfile alone, without a dependency cache.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # From this release's own lockfiles; tauri.conf.json bundles it into every package.
      - run: pnpm notices

      - name: Build
        env:
          ANKYLOCK_GOOGLE_CLIENT_ID: ${{ secrets.ANKYLOCK_GOOGLE_CLIENT_ID }}
          ANKYLOCK_GOOGLE_CLIENT_SECRET: ${{ secrets.ANKYLOCK_GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_RELAY_URL: ''
        run: |
          # Without a client id the app would build without Google sign-in.
          if [ -z "$ANKYLOCK_GOOGLE_CLIENT_ID" ]; then echo "::error::Set the ANKYLOCK_GOOGLE_CLIENT_ID secret."; exit 1; fi
          # Updater artifacts (the AppImage's .sig) only here, where the signing key is.
          pnpm --filter @ankylock/desktop exec tauri build --ci --bundles appimage,deb,rpm \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig \
            target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm THIRD_PARTY_NOTICES.md release/
          appimage=$(basename release/*.AppImage)
          node scripts/release-files.ts manifest "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$appimage" "release/$appimage.sig" > release/latest.json
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ankylock-${{ steps.version.outputs.version }}-linux
          path: release/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Draft the GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Build provenance attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ankylock-${{ needs.build.outputs.version }}-linux
          path: release/
      - name: Check the files against their checksums
        run: cd release && sha256sum --check SHA256SUMS

      - name: Repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
      # Attestations need a public repository (or GitHub Enterprise).
      - if: steps.visibility.outputs.private == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node scripts/release-files.ts notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" release/* --draft --verify-tag --title "AnkyLock $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
