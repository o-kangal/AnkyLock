[package]
name = "ankylock-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-opener = "2.7.1"
tauri-plugin-dialog = "2.7.3"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
