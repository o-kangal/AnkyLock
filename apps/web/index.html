<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f3f3" />
    <!-- Until the app applies the stored theme, the blank page follows the OS. -->
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>AnkyLock</title>
  </head>
  <!-- dvh: mobile browsers' 100vh includes the collapsing address bar. Safe-area insets keep
       content clear of notches and home indicators (viewport-fit=cover). -->
  <body style="margin: 0; height: 100vh; height: 100dvh; overflow: hidden">
    <div
      id="root"
      style="height: 100%; box-sizing: border-box; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"
    ></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
